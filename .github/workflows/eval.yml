name: eval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true

      - name: Sync the lockfile
        run: uv sync --frozen --extra agent

      - name: Grade the summary agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is not set. Add it as a repository secret."
            exit 1
          fi
          uv run pv-eval --output eval-report.md

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.md
          if-no-files-found: warn
