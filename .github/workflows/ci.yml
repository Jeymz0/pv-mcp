name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true

      - name: Sync the lockfile
        run: uv sync --frozen

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest --cov=pv_mcp --cov-report=term-missing

      - name: Audit runtime dependencies
        run: |
          req="${RUNNER_TEMP}/requirements.txt"
          uv export --frozen --no-dev --no-emit-project --format requirements.txt -o "$req" >/dev/null
          uv run pip-audit --requirement "$req" --disable-pip --progress-spinner off
