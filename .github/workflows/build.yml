name: build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: |
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/${repo}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: pv-mcp:scan
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write the SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pv-mcp:scan
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Scan the image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pv-mcp:scan
          format: table
          output: scan.txt
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Show the scan
        if: always()
        run: |
          if [ -f scan.txt ]; then
            cat scan.txt
          fi

      - name: Upload the SBOM and the scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-reports
          path: |
            sbom.cdx.json
            scan.txt
          if-no-files-found: warn

      - name: Tag and push
        run: |
          docker tag pv-mcp:scan "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag pv-mcp:scan "$IMAGE:main"
            docker push "$IMAGE:main"
          fi

      - name: Mark the package public
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | cut -d/ -f2)
          gh api --method PUT -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${package}/visibility" \
            -f visibility=public
          echo "Asked GitHub to mark the ${package} package public."
