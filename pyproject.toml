[project]
name = "pv-mcp"
version = "0.1.0"
description = "Read-only MCP server for public pharmacovigilance data from openFDA."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
]

[project.scripts]
pv-mcp = "pv_mcp.__main__:main"
pv-agent = "pv_mcp.agent.cli:main"

[project.optional-dependencies]
agent = [
    "langchain-groq==1.2.0",
    "langchain[mcp]==1.5.0",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pv_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pv_mcp"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:`langchain.mcp` is in beta:langchain_core._api.beta_decorator.LangChainBetaWarning",
]

[tool.coverage.run]
source = ["pv_mcp"]

[tool.coverage.report]
fail_under = 90
show_missing = true
